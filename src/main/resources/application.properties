spring.application.name=futebol-analytics

# --- Banco -------------------------------------------------------------------
# Padrão: H2 em memória, para rodar sem instalar nada.
# Em Docker/Kubernetes, SPRING_DATASOURCE_URL/USERNAME/PASSWORD apontam para o PostgreSQL.
spring.datasource.url=jdbc:h2:mem:futebol;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# O esquema é criado pelo Flyway (db/migration); o Hibernate só confere.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Coleta ------------------------------------------------------------------
# fonte: "arquivo" (CSV local) ou "football-data" (API; exige FOOTBALL_DATA_TOKEN)
futebol.coleta.fonte=arquivo
futebol.coleta.arquivo=classpath:dados/partidas-demo.csv
futebol.coleta.ao-iniciar=true
futebol.coleta.agendada=false
futebol.coleta.cron=0 0 */6 * * *
futebol.coleta.competicoes[0].codigo=DEMO
futebol.coleta.competicoes[0].temporada=2026

futebol.football-data.url-base=https://api.football-data.org/v4
futebol.football-data.token=${FOOTBALL_DATA_TOKEN:}

# --- Operação ----------------------------------------------------------------
# /actuator/health/liveness e /actuator/health/readiness, usados pelo Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
